; Sample Supervisor config for Writer (the PM2 replacement).
;
; Writer is a plain PHP application. When you serve it with Apache or Nginx +
; PHP-FPM you do NOT need this file — the web server already supervises PHP.
; Use Supervisor only when you run Writer with PHP's built-in server on the host
; (small boxes, LAN appliances, no php-fpm). This replaces the PM2 setup used by
; the previous Node version.
;
; One [program:] per blog instance. Each program:
;   - runs `php -S 127.0.0.1:PORT index.php` from the release webroot symlink
;     (`public_html -> releases/current`), so a restart picks up the new release;
;   - points WRITER_DB_PATH and WRITER_OG_DIR at <deployTo>/shared/, outside
;     releases/, so the database and OG cache survive deploys;
;   - sets PHP_CLI_SERVER_WORKERS because the built-in server is single-threaded.
;
; Requirements: PHP 8.1+ with pdo_sqlite (FTS5), gd (FreeType), sodium and
; mbstring. For the built-in server, enable OPcache with `opcache.enable_cli=1`
; in the PHP CLI ini.
;
; Install:
;   sudo cp docs/supervisord.sample.conf /etc/supervisor/conf.d/writer.conf
;   sudo mkdir -p /var/log/writer && sudo chown <user> /var/log/writer
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Then put a reverse proxy (Nginx) in front of 127.0.0.1:PORT, or expose the
; port directly on a trusted network.

[program:geek-blog]
command=php -S 127.0.0.1:8080 index.php
directory=/home/admin/apps/geek-blog/public_html
environment=WRITER_DB_PATH="/home/admin/apps/geek-blog/shared/writer.sqlite",WRITER_OG_DIR="/home/admin/apps/geek-blog/shared/og-images",PHP_CLI_SERVER_WORKERS="3"
user=admin
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/writer/geek.out.log
stderr_logfile=/var/log/writer/geek.err.log

[program:firstclass-blog]
command=php -S 127.0.0.1:9090 index.php
directory=/home/admin/apps/firstclass-blog/public_html
environment=WRITER_DB_PATH="/home/admin/apps/firstclass-blog/shared/writer.sqlite",WRITER_OG_DIR="/home/admin/apps/firstclass-blog/shared/og-images",PHP_CLI_SERVER_WORKERS="3"
user=admin
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/writer/firstclass.out.log
stderr_logfile=/var/log/writer/firstclass.err.log
