; Sample Supervisor config for Writer (the PM2 replacement).
;
; Writer is a plain PHP application. When you serve it with Apache or Nginx +
; PHP-FPM you do NOT need this file — the web server already supervises PHP.
; Use Supervisor only when you run Writer with PHP's built-in server and want a
; process manager around it (small boxes, LAN appliances, no php-fpm).
;
; Install:
;   sudo cp docs/supervisord.sample.conf /etc/supervisor/conf.d/writer.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Then put a reverse proxy (Nginx) in front of 127.0.0.1:8080, or expose the
; port directly on a trusted network.

[program:writer]
command=php -S 127.0.0.1:8080 -t /home/admin/apps/writer-blog/public_html /home/admin/apps/writer-blog/public_html/index.php
directory=/home/admin/apps/writer-blog/public_html
environment=WRITER_DB_PATH="/home/admin/apps/writer-blog/private/writer.sqlite"
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/writer/stdout.log
stderr_logfile=/var/log/writer/stderr.log
user=admin
